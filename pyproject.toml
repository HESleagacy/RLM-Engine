[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "layered-reasoning"
version = "0.1.0"
description = "Layered Reasoning System — controlled executable cognitive pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "datasets>=2.0.0",
  "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
groq = [
  "groq>=0.11.0",
  "python-dotenv>=1.0.0",
]
demo = [
  "flask>=3.0",
  "groq>=0.11.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
rlm = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
configs = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
