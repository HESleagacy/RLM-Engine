<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RLM vs RAG — Consistency Challenge</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242836;
      --border: #2e3345;
      --text: #e4e6f0;
      --text-dim: #8b8fa3;
      --accent: #6c63ff;
      --accent-hover: #7f78ff;
      --green: #22c55e;
      --red: #ef4444;
      --orange: #f59e0b;
      --blue: #3b82f6;
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 40px 0 32px;
    }
    .header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .header p {
      color: var(--text-dim);
      font-size: 1rem;
      max-width: 700px;
      margin: 0 auto;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .controls label {
      color: var(--text-dim);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .controls input[type="number"] {
      width: 80px;
      padding: 8px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
    }
    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--border); }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Two-column layout */
    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    @media (max-width: 900px) {
      .panels { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-body {
      padding: 20px;
    }

    /* Textareas */
    textarea {
      width: 100%;
      min-height: 200px;
      padding: 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.85rem;
      resize: vertical;
      line-height: 1.5;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    textarea.tall { min-height: 300px; }

    /* Facts display */
    .facts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .fact-tag {
      padding: 8px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.82rem;
      font-family: monospace;
    }
    .fact-tag .key { color: var(--text-dim); }
    .fact-tag .val { color: var(--accent); font-weight: 600; }

    /* Score cards */
    .score-card {
      margin-top: 16px;
      padding: 16px;
      background: var(--surface2);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .score-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .score-pct {
      font-size: 2rem;
      font-weight: 700;
    }
    .score-pct.high { color: var(--green); }
    .score-pct.mid { color: var(--orange); }
    .score-pct.low { color: var(--red); }
    .score-label {
      font-size: 0.85rem;
      color: var(--text-dim);
    }
    .fact-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .fact-chip {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 500;
    }
    .fact-chip.present {
      background: rgba(34, 197, 94, 0.15);
      color: var(--green);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .fact-chip.missing {
      background: rgba(239, 68, 68, 0.15);
      color: var(--red);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Status bar */
    .status {
      text-align: center;
      padding: 12px;
      color: var(--text-dim);
      font-size: 0.85rem;
    }
    .status.error { color: var(--red); }
    .status.success { color: var(--green); }

    /* Progress bar */
    .progress-bar {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 20px;
      display: none;
    }
    .progress-bar.active { display: block; }
    .progress-bar .fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--blue));
      animation: progress 2s ease-in-out infinite;
      width: 30%;
    }
    @keyframes progress {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }

    /* Badge */
    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-rag {
      background: rgba(245, 158, 11, 0.15);
      color: var(--orange);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .badge-rlm {
      background: rgba(108, 99, 255, 0.15);
      color: var(--accent);
      border: 1px solid rgba(108, 99, 255, 0.3);
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>🧠 RLM vs RAG — Consistency Challenge</h1>
    <p>Generate a fact-scattered document, then compare how <strong>RAG</strong> (retrieval-only) and <strong>RLM</strong> (recursive reasoning) handle story generation with all facts.</p>
  </div>

  <!-- Controls -->
  <div class="controls">
    <label>
      Seed:
      <input type="number" id="seed" value="42" min="1" max="9999">
    </label>
    <button class="btn btn-secondary" id="btnGenerate" onclick="generateDoc()">
      🎲 Generate Document
    </button>
    <button class="btn btn-primary" id="btnRun" onclick="runComparison()">
      🚀 Run Comparison
    </button>
  </div>

  <!-- Progress -->
  <div class="progress-bar" id="progressBar">
    <div class="fill"></div>
  </div>

  <!-- Status -->
  <div class="status" id="status"></div>

  <!-- Document + Facts -->
  <div class="panels">
    <div class="panel">
      <div class="panel-header">
        <h2>📄 Document</h2>
        <span class="score-label" id="docLength"></span>
      </div>
      <div class="panel-body">
        <textarea id="document" class="tall" placeholder="Click 'Generate Document' or paste your own fact-scattered document here..."></textarea>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <h2>📋 Facts</h2>
        <span class="score-label" id="factCount"></span>
      </div>
      <div class="panel-body">
        <div id="factsDisplay" class="facts-grid"></div>
        <textarea id="factsRaw" style="margin-top:12px; min-height:120px;" placeholder="Hero = Arjun&#10;City = Neo Mumbai&#10;..."></textarea>
      </div>
    </div>
  </div>

  <!-- Results -->
  <div class="panels" id="resultsSection" style="display:none;">
    <!-- RAG -->
    <div class="panel">
      <div class="panel-header">
        <h2>📦 RAG Story</h2>
        <span class="badge badge-rag">BM25 + LLM</span>
      </div>
      <div class="panel-body">
        <textarea id="ragStory" class="tall" readonly placeholder="RAG output will appear here..."></textarea>
        <div class="score-card" id="ragScore"></div>
      </div>
    </div>
    <!-- RLM -->
    <div class="panel">
      <div class="panel-header">
        <h2>🧠 RLM Story</h2>
        <span class="badge badge-rlm">REPL + Sub-LLM</span>
      </div>
      <div class="panel-body">
        <textarea id="rlmStory" class="tall" readonly placeholder="RLM output will appear here..."></textarea>
        <div class="score-card" id="rlmScore"></div>
      </div>
    </div>
  </div>
</div>

<script>
  let currentFacts = {};

  function setStatus(msg, type = '') {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + type;
  }

  function setProgress(active) {
    document.getElementById('progressBar').className = active ? 'progress-bar active' : 'progress-bar';
  }

  function setButtons(disabled) {
    document.getElementById('btnGenerate').disabled = disabled;
    document.getElementById('btnRun').disabled = disabled;
  }

  async function generateDoc() {
    const seed = parseInt(document.getElementById('seed').value) || 42;
    setStatus('Generating document...');
    setProgress(true);
    setButtons(true);

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ seed }),
      });
      const data = await res.json();

      document.getElementById('document').value = data.document;
      document.getElementById('docLength').textContent = `${data.document.length.toLocaleString()} chars`;

      currentFacts = data.facts;
      renderFacts(data.facts);

      // Also fill raw textarea
      const raw = Object.entries(data.facts).map(([k, v]) => `${k} = ${v}`).join('\n');
      document.getElementById('factsRaw').value = raw;
      document.getElementById('factCount').textContent = `${Object.keys(data.facts).length} facts`;

      setStatus('Document generated! Click "Run Comparison" to test both pipelines.', 'success');
    } catch (e) {
      setStatus('Error: ' + e.message, 'error');
    } finally {
      setProgress(false);
      setButtons(false);
    }
  }

  function renderFacts(facts) {
    const container = document.getElementById('factsDisplay');
    container.innerHTML = Object.entries(facts).map(([k, v]) =>
      `<div class="fact-tag"><span class="key">${k}:</span> <span class="val">${v}</span></div>`
    ).join('');
  }

  function parseFacts() {
    // Try currentFacts first, fall back to parsing textarea
    if (Object.keys(currentFacts).length > 0) return currentFacts;

    const raw = document.getElementById('factsRaw').value;
    const facts = {};
    for (const line of raw.split('\n')) {
      if (line.includes('=')) {
        const [k, ...rest] = line.split('=');
        facts[k.trim()] = rest.join('=').trim();
      }
    }
    return facts;
  }

  function renderScore(containerId, score) {
    const el = document.getElementById(containerId);
    if (!score || !score.accuracy && score.accuracy !== 0) {
      el.innerHTML = '';
      return;
    }

    const pct = Math.round(score.accuracy * 100);
    const cls = pct >= 80 ? 'high' : pct >= 50 ? 'mid' : 'low';

    let html = `
      <div class="score-header">
        <div>
          <div class="score-pct ${cls}">${pct}%</div>
          <div class="score-label">Fact Accuracy</div>
        </div>
        <div class="score-label">${(score.present || []).length} / ${(score.present || []).length + (score.missing || []).length} facts</div>
      </div>
    `;

    if (score.present && score.present.length > 0) {
      html += '<div class="fact-list">';
      for (const f of score.present) {
        html += `<span class="fact-chip present">✓ ${f}</span>`;
      }
      html += '</div>';
    }

    if (score.missing && score.missing.length > 0) {
      html += '<div class="fact-list" style="margin-top:6px;">';
      for (const f of score.missing) {
        html += `<span class="fact-chip missing">✗ ${f}</span>`;
      }
      html += '</div>';
    }

    el.innerHTML = html;
  }

  async function runComparison() {
    const document_text = document.getElementById('document').value;
    const facts = parseFacts();

    if (!document_text.trim()) {
      setStatus('Please generate or paste a document first.', 'error');
      return;
    }
    if (Object.keys(facts).length === 0) {
      setStatus('No facts found. Generate a document or enter facts manually.', 'error');
      return;
    }

    setStatus('Running RAG and RLM pipelines... This may take 30-60 seconds.');
    setProgress(true);
    setButtons(true);
    document.getElementById('resultsSection').style.display = 'grid';
    document.getElementById('ragStory').value = 'Running...';
    document.getElementById('rlmStory').value = 'Running...';
    renderScore('ragScore', null);
    renderScore('rlmScore', null);

    try {
      const res = await fetch('/api/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ document: document_text, facts, pipeline: 'both' }),
      });
      const data = await res.json();

      if (data.error) {
        setStatus('Error: ' + data.error, 'error');
        return;
      }

      // RAG
      if (data.rag) {
        document.getElementById('ragStory').value = data.rag.story;
        renderScore('ragScore', data.rag.score);
      }

      // RLM
      if (data.rlm) {
        document.getElementById('rlmStory').value = data.rlm.story;
        renderScore('rlmScore', data.rlm.score);
      }

      setStatus('Comparison complete!', 'success');
    } catch (e) {
      setStatus('Error: ' + e.message, 'error');
    } finally {
      setProgress(false);
      setButtons(false);
    }
  }
</script>

</body>
</html>
